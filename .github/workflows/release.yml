name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 20 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify tag matches package version
        run: |
          tag="${{ github.ref_name }}"
          version="v$(node -p "require('./packages/spec/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi
      # Publish @francav/spec first; profiles and policies depend on it.
      - run: npm publish --workspace @francav/spec --access public --provenance
      - run: npm publish --workspace @francav/profiles --access public --provenance
      - run: npm publish --workspace @francav/policies --access public --provenance
      # @francav/conformance (CC0 test vectors) is intentionally NOT auto-published:
      # it has never been bootstrapped on npm, and trusted publishing can't do a
      # brand-new package's first publish. To publish it later: bootstrap once
      # locally (npm publish from packages/conformance), then re-add the line.
